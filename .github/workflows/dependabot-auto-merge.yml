name: Dependabot Auto-Merge

# Merges Dependabot patch/minor updates for the site (root npm + GitHub Actions)
# once the same validate + build steps deploy.yml runs have passed, then dispatches
# the deploy. Majors (incl. 0.x minors) and /infrastructure updates are left open
# for a human: majors are deliberately kept out of the dependabot.yml groups so they
# get reviewed, and CDK changes are deployed by hand, never from CI.
#
# Why the previous version never merged anything (every run failed 2026-05..10):
# - `gh pr review --approve` died with "GitHub Actions is not permitted to approve
#   pull requests" (repo setting, intentionally off). main has no branch protection,
#   so no approval is needed -- the step is gone rather than the setting loosened.
# - `gh pr merge --auto` needs the repo's allow-auto-merge setting (off) and would
#   have merged without any build check. The build gate below replaces it.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    # `npm ci` runs the updated packages' install scripts, so this job only ever
    # holds a read-only token.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-26.04  # same image as deploy.yml's validate job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run validate:html
      - run: npm run validate:refs
      # postbuild runs validate:dist, which fails on any asset the build didn't emit.
      - run: npm run build

  auto-merge:
    needs: verify
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write   # dispatch deploy.yml
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Decide whether to merge
        id: decide
        env:
          DIRECTORY: ${{ steps.metadata.outputs.directory }}
          UPDATED_DEPS: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          # Allow-list per dependency: patch, or minor from a >=1.0 version. A 0.x
          # minor (e.g. sharp 0.34 -> 0.35) is breaking under semver but fetch-metadata
          # reports it as semver-minor; an unknown type or version is held too.
          held=$(jq -r '[.[]
              | select(
                  (.updateType == "version-update:semver-patch") or
                  (.updateType == "version-update:semver-minor" and
                    (.prevVersion | test("^v?[1-9]")))
                | not)
              | "\(.dependencyName) \(.prevVersion) -> \(.newVersion) (\(.updateType))"]
            | join("; ")' <<< "$UPDATED_DEPS")

          if [ "$DIRECTORY" != "/" ]; then
            echo "Holding: $DIRECTORY updates are deployed by hand (CDK), not auto-merged."
            echo "merge=false" >> "$GITHUB_OUTPUT"
          elif [ "$(jq 'length' <<< "$UPDATED_DEPS")" -eq 0 ]; then
            echo "Holding: no updated-dependencies metadata to judge the update."
            echo "merge=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$held" ]; then
            echo "Holding for human review: $held"
            echo "merge=false" >> "$GITHUB_OUTPUT"
          else
            echo "merge=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge
        id: merge
        if: steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # --match-head-commit: only merge the exact commit the verify job built.
          gh pr merge "$PR_URL" --squash --delete-branch --match-head-commit "$HEAD_SHA"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN merges don't fire push events, so deploy.yml must be dispatched.
          gh workflow run "Deploy to AWS" --repo "${{ github.repository }}" --ref main
          echo "Deploy workflow dispatched"
